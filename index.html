<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>桌面小夥伴</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+HK:wght@300;400;500;700&display=swap');

  :root{
    --bg: #0F1115;
    --screen: #171B21;
    --screen-edge: #23282F;
    --gold: #E3A94A;
    --gold-dim: #E3A94A66;
    --rose: #E8A2A8;
    --teal: #5FA8A0;
    --ink: #EFEAE0;
    --ink-dim: #9CA3AC;
    --divider: #2A2F37;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% -10%, #23283066 0%, transparent 55%),
      radial-gradient(ellipse at 90% 110%, #E3A94A14 0%, transparent 50%),
      var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 28px 16px;
    font-family:'Noto Sans HK', sans-serif;
    color: var(--ink);
  }

  .device{
    width: 100%;
    max-width: 960px;
    background: linear-gradient(155deg, var(--screen-edge), var(--screen) 12%);
    border-radius: 28px;
    padding: 22px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.04);
    position: relative;
  }

  /* screw dots, echoing the reference mock's hardware bezel */
  .device::before, .device::after{
    content:'';
    position:absolute;
    width:6px; height:6px;
    border-radius:50%;
    background: #3A4048;
    top:14px;
  }
  .device::before{ left:14px; }
  .device::after{ right:14px; }

  .screen{
    background: linear-gradient(160deg, #10131700, #00000022);
    border-radius: 18px;
    padding: 26px 24px 20px;
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 22px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .companion{
    width: 30px; height: 30px;
    border-radius: 9px;
    background: linear-gradient(145deg, var(--teal), #3d7c76);
    position: relative;
    flex-shrink:0;
  }
  .companion .eye{
    position:absolute;
    width:4px; height:4px;
    background: var(--ink);
    border-radius:50%;
    top:12px;
    animation: blink 4.5s infinite;
  }
  .companion .eye.l{ left:8px; }
  .companion .eye.r{ right:8px; }
  @keyframes blink{
    0%,90%,100%{ transform: scaleY(1); }
    93%{ transform: scaleY(0.1); }
  }

  .brand-text{ line-height:1.2; }
  .brand-text .name{ font-size:13px; font-weight:500; color: var(--ink); }
  .brand-text .tag{ font-size:11px; color: var(--ink-dim); letter-spacing:0.5px; }

  .menu-pill{
    font-size:11px;
    color: var(--ink-dim);
    border:1px solid var(--divider);
    padding: 5px 14px;
    border-radius: 999px;
    letter-spacing: 1px;
  }

  .clock-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap: 24px;
    margin-bottom: 20px;
  }

  .clock{
    font-family:'Space Grotesk', sans-serif;
    font-size: 76px;
    font-weight: 600;
    letter-spacing: 1px;
    line-height:1;
    background: linear-gradient(90deg, var(--gold), var(--rose));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .date-line{
    margin-top: 10px;
    font-size: 13px;
    color: var(--ink-dim);
    display:flex;
    gap:8px;
    align-items:center;
  }
  .date-line .dow{
    color: var(--teal);
    font-weight:500;
  }

  .weather{
    text-align:center;
    flex-shrink:0;
    min-width: 150px;
    border: 1px solid var(--divider);
    border-radius: 14px;
    padding: 14px 22px;
    background: rgba(255,255,255,0.02);
  }
  .weather .wtag{
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: 1.5px;
    opacity:0.7;
  }
  .weather .temp{
    font-family:'Space Grotesk', sans-serif;
    font-size: 30px;
    font-weight:600;
    margin-top: 4px;
  }
  .weather .cond{
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 4px;
  }
  .weather .loc{
    font-size: 11px;
    color: var(--ink-dim);
    opacity:0.7;
    margin-top: 2px;
  }

  .quote-box{
    border-top: 1px solid var(--divider);
    padding-top: 16px;
    display:flex;
    gap: 14px;
    align-items:center;
  }

  .quote-box .qtag{
    font-size: 11px;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    padding: 3px 9px;
    border-radius: 999px;
    flex-shrink:0;
    letter-spacing: 1px;
  }

  .quote-box p{
    font-size: 14px;
    line-height:1.6;
    color: var(--ink);
  }

  /* --- AI 陪伴表情：機甲小智（暗色／薄荷）同貓仔小喵（暖色） --- */
  .buddy{
    width: 62px; height: 62px;
    flex-shrink:0;
    position:relative;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .buddy:active{ transform: scale(0.94); }

  .buddy .face{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    border-radius: 16px;
    display:none;
  }
  .buddy .face-mecha{ display:block; }
  body.theme-cat-mode .buddy .face-mecha{ display:none; }
  body.theme-cat-mode .buddy .face-cat{ display:block; }

  .face-mecha{
    background: linear-gradient(150deg, #2B333E, #14181D);
    border: 1px solid var(--divider);
  }
  .face-mecha .antenna{
    position:absolute;
    top:-7px; left:50%;
    width:2px; height:7px;
    margin-left:-1px;
    background: var(--teal);
  }
  .face-mecha .antenna::after{
    content:'';
    position:absolute;
    top:-5px; left:-2px;
    width:6px; height:6px;
    border-radius:50%;
    background: var(--teal);
  }
  .face-mecha .eye{
    position:absolute;
    top:19px;
    width:11px; height:15px;
    border-radius: 5px;
    background: #EFEAE0;
    box-shadow: 0 0 10px rgba(95,168,160,0.4);
  }
  .face-mecha .mouth{
    position:absolute;
    bottom:12px; left:50%;
    width:16px; height:5px;
    margin-left:-8px;
    border-radius: 3px;
    background: var(--teal);
  }

  .face-cat{
    background: linear-gradient(150deg, #F6D9C8, #E8A98F);
    border: 1px solid #E0B49E;
  }
  .face-cat .ear{
    position:absolute;
    top:-5px;
    width:18px; height:18px;
    border-radius: 5px;
    background: #F0CBB4;
    transform: rotate(45deg);
  }
  .face-cat .ear.l{ left:5px; }
  .face-cat .ear.r{ right:5px; }
  .face-cat .eye{
    position:absolute;
    top:25px;
    width:9px; height:11px;
    border-radius:50%;
    background:#4A2C1E;
  }
  .face-cat .mouth{
    position:absolute;
    bottom:13px; left:50%;
    width:14px; height:7px;
    margin-left:-7px;
    border:2px solid #7A4632;
    border-top:none;
    border-radius: 0 0 10px 10px;
  }

  .buddy .eye.l{ left:14px; }
  .buddy .eye.r{ right:14px; }

  /* 表情狀態：待機眨眼／連接眼仔碌來碌去／講嘢郁嘴 */
  .buddy .eye{ animation: blink 4.5s infinite; }
  .buddy[data-state="connect"] .eye{ animation: lookaround 1.6s ease-in-out infinite; }
  @keyframes lookaround{
    0%,100%{ transform: translateX(0); }
    30%{ transform: translateX(-3px); }
    70%{ transform: translateX(3px); }
  }
  .face-mecha .mouth{ transform: scaleY(0.35); }
  .buddy[data-state="speak"] .mouth{
    animation: chat 0.35s ease-in-out infinite alternate;
  }
  @keyframes chat{
    from{ transform: scaleY(0.35); }
    to{ transform: scaleY(1.15); }
  }

  /* 對話氣泡 */
  .bubble{
    position:relative;
    flex:1;
    border:1px solid var(--divider);
    border-radius: 14px;
    padding: 11px 16px 12px;
  }
  .bubble::before{
    content:'';
    position:absolute;
    left:-6px; top:24px;
    width:10px; height:10px;
    background: var(--screen);
    border-left:1px solid var(--divider);
    border-bottom:1px solid var(--divider);
    transform: rotate(45deg);
  }
  .bubble-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 7px;
  }
  .buddy-status{
    font-size: 11px;
    color: var(--ink-dim);
  }

  .theme-row{
    display:flex;
    justify-content:center;
    gap: 10px;
    margin-top: 20px;
  }

  .theme-dot{
    width: 22px; height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }
  .theme-dot:hover{ transform: scale(1.1); }
  .theme-dot.active{ border-color: var(--ink); }

  .theme-dark{ background: linear-gradient(135deg,#171B21,#23282F); }
  .theme-cat{ background: linear-gradient(135deg,#F2D9CE,#E8A2A8); }
  .theme-mint{ background: linear-gradient(135deg,#DCE8E1,#8FBBA8); }

  /* --- 通用可折疊 section（電台／podcast／日曆／番茄鐘都用呢個殼） --- */
  .section{
    border-top: 1px solid var(--divider);
    padding-top: 16px;
    margin-top: 16px;
  }

  .section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
  }

  .section-header .stag{
    font-size: 11px;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 1px;
  }

  .section-header .chev{
    font-size: 11px;
    color: var(--ink-dim);
    transition: transform 0.2s ease;
  }

  .section.collapsed .chev{ transform: rotate(-90deg); }
  .section.collapsed .section-body{ display:none; }

  .section-body{ margin-top: 14px; }

  .btn{
    font-size: 12px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--divider);
    padding: 7px 18px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .btn:hover{ border-color: var(--gold); color: var(--gold); }
  .btn:active{ transform: scale(0.97); }

  /* --- 電台 --- */
  .now-playing{
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 10px;
  }
  .now-playing .live-dot{
    display:none;
    width:6px; height:6px;
    border-radius:50%;
    background: var(--teal);
    margin-right:7px;
    vertical-align:middle;
  }
  .now-playing .live-dot.on{
    display:inline-block;
    animation: pulse 2s infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.3; }
  }

  .station-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .station-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--divider);
    font-size:13px;
    cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .station-item:hover{ border-color: var(--gold-dim); }
  .station-item.active{
    border-color: var(--gold);
    background: linear-gradient(90deg, var(--gold-dim), transparent);
  }
  .station-item .badge{ font-size:11px; color: var(--ink-dim); }

  .radio-controls{
    display:flex;
    justify-content:flex-end;
    margin-top:12px;
  }

  /* --- 播客 --- */
  .pod-add{
    display:flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .pod-add input{
    flex:1;
    min-width:0;
    font-size: 13px;
    font-family:'Noto Sans HK', sans-serif;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--divider);
    border-radius: 999px;
    padding: 7px 16px;
    outline: none;
  }
  .pod-add input:focus{ border-color: var(--gold-dim); }
  .pod-add input::placeholder{ color: var(--ink-dim); opacity: 0.7; }

  .station-item .name{
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .station-item .meta{
    font-size: 11px;
    color: var(--ink-dim);
    flex-shrink: 0;
    margin-left: 10px;
  }

  .pod-del{
    font-size: 15px;
    color: var(--ink-dim);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0 2px 0 12px;
    line-height: 1;
    flex-shrink: 0;
  }
  .pod-del:hover{ color: var(--rose); }

  .station-item .name{ flex: 1; }
  .station-item .meta{
    max-width: 38%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pod-art{
    width: 26px; height: 26px;
    border-radius: 6px;
    flex-shrink: 0;
    margin-right: 10px;
    background: rgba(255,255,255,0.05);
  }

  .pod-sub{
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 1px;
    margin: 14px 0 8px;
  }

  .pod-episodes{
    max-height: 224px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .pod-hint{
    font-size: 12px;
    color: var(--ink-dim);
    opacity: 0.75;
    padding: 4px 2px;
  }

  /* --- light / cat theme override --- */
  body.theme-cat-mode{
    --bg:#F7ECE4; --screen:#FBEFE7; --screen-edge:#F0DCCF;
    --gold:#D98A5E; --rose:#E38C97; --teal:#C77B7B;
    --ink:#3A241C; --ink-dim:#8A6A5C; --divider:#E6CFC0;
  }
  body.theme-mint-mode{
    --bg:#EEF3EF; --screen:#F5F9F6; --screen-edge:#E2ECE5;
    --gold:#7FA98F; --rose:#9DBFA8; --teal:#5C8E77;
    --ink:#22322A; --ink-dim:#6E8B7B; --divider:#D6E4DB;
  }

  @media (max-width: 480px){
    .clock{ font-size: 52px; }
    .clock-row{ flex-direction: column; }
    .weather{ text-align:left; }
  }

  @media (prefers-reduced-motion: reduce){
    .companion .eye, .buddy .eye, .buddy .mouth{ animation: none; }
  }
</style>
</head>
<body>

  <div class="device">
    <div class="screen">
      <div class="topbar">
        <div class="brand">
          <div class="companion"><span class="eye l"></span><span class="eye r"></span></div>
          <div class="brand-text">
            <div class="name">桌面小夥伴</div>
            <div class="tag" id="companion-status">陪伴中</div>
          </div>
        </div>
        <div class="menu-pill">MENU</div>
      </div>

      <div class="clock-row">
        <div>
          <div class="clock" id="clock">--:--</div>
          <div class="date-line">
            <span id="date">-- / --</span>
            <span class="dow" id="dow">---</span>
          </div>
        </div>
        <div class="weather">
          <div class="wtag">WEATHER</div>
          <div class="temp" id="temp">--°C</div>
          <div class="cond" id="cond">載入中</div>
          <div class="loc" id="loc">London</div>
        </div>
      </div>

      <div class="quote-box">
        <div class="buddy" id="buddy" data-state="idle">
          <div class="face face-mecha">
            <span class="antenna"></span>
            <span class="eye l"></span><span class="eye r"></span>
            <span class="mouth"></span>
          </div>
          <div class="face face-cat">
            <span class="ear l"></span><span class="ear r"></span>
            <span class="eye l"></span><span class="eye r"></span>
            <span class="mouth"></span>
          </div>
        </div>
        <div class="bubble">
          <div class="bubble-top">
            <span class="qtag">今日一句</span>
            <span class="buddy-status" id="buddy-status">小智 · 待機中</span>
          </div>
          <p id="quote">你只管努力，剩下的交給時間。</p>
        </div>
      </div>

      <div class="section" data-key="radio">
        <div class="section-header">
          <span class="stag">電台</span>
          <span class="chev">▾</span>
        </div>
        <div class="section-body">
          <div class="now-playing" id="radio-now">
            <span class="live-dot" id="radio-dot"></span><span id="radio-now-text">未播放</span>
          </div>
          <div class="station-list" id="radio-list"></div>
          <div class="radio-controls">
            <button class="btn" id="radio-toggle">播放</button>
          </div>
          <audio id="radio-player" preload="none"></audio>
        </div>
      </div>

      <div class="section" data-key="podcast">
        <div class="section-header">
          <span class="stag">播客</span>
          <span class="chev">▾</span>
        </div>
        <div class="section-body">
          <div class="now-playing">
            <span class="live-dot" id="pod-dot"></span><span id="pod-now-text">未播放</span>
          </div>
          <div class="pod-add">
            <input type="text" id="pod-url" placeholder="搜尋 Apple Podcasts，或者貼 RSS／MP3 連結" />
            <button class="btn" id="pod-add-btn">搜尋</button>
          </div>
          <div class="pod-sub" id="pod-results-sub" hidden>搜尋結果（撳一下加入）</div>
          <div class="station-list" id="pod-results"></div>
          <div class="station-list" id="pod-list"></div>
          <div class="pod-sub" id="pod-sub" hidden>最新單集</div>
          <div class="station-list pod-episodes" id="pod-episodes"></div>
          <audio id="pod-player" preload="none"></audio>
        </div>
      </div>
    </div>

    <div class="theme-row">
      <div class="theme-dot theme-dark active" data-theme="dark"></div>
      <div class="theme-dot theme-cat" data-theme="cat"></div>
      <div class="theme-dot theme-mint" data-theme="mint"></div>
    </div>
  </div>

<script>
  // ---- 時鐘 + 日期 ----
  function updateClock(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = `${hh}:${mm}`;

    const mon = String(now.getMonth()+1).padStart(2,'0');
    const day = String(now.getDate()).padStart(2,'0');
    document.getElementById('date').textContent = `${mon}/${day}`;

    const dows = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    document.getElementById('dow').textContent = dows[now.getDay()];
  }
  updateClock();
  setInterval(updateClock, 1000 * 10); // 每十秒夠用，慳返電

  // ---- AI 陪伴表情：待機／連接／講嘢三種狀態 ----
  const buddyEl = document.getElementById('buddy');
  const buddyStatusEl = document.getElementById('buddy-status');
  const topbarStatusEl = document.getElementById('companion-status');
  const BUDDY_STATE_TEXT = { idle: '待機中', connect: '連接緊…', speak: '講緊嘢…' };
  let buddyState = 'idle';
  let buddyTalkTimer = null;

  function buddyName(){
    return document.body.classList.contains('theme-cat-mode') ? '小喵' : '小智';
  }

  function renderBuddy(){
    buddyEl.dataset.state = buddyState;
    buddyStatusEl.textContent = `${buddyName()} · ${BUDDY_STATE_TEXT[buddyState]}`;
    topbarStatusEl.textContent = BUDDY_STATE_TEXT[buddyState];
  }

  function setBuddyState(state){
    buddyState = state;
    renderBuddy();
  }

  // 冇嘢做嗰陣返去待機；電台或者播客播緊就當佢講緊嘢
  function buddyRest(){
    let playing = false;
    try{ playing = !radioPlayer.paused || !podPlayer.paused; }catch(e){}
    setBuddyState(playing ? 'speak' : 'idle');
  }

  // 撳一下小夥伴，佢會隨機講句嘢
  buddyEl.addEventListener('click', () => {
    const q = quotes[Math.floor(Math.random() * quotes.length)];
    document.getElementById('quote').textContent = q;
    setBuddyState('speak');
    clearTimeout(buddyTalkTimer);
    buddyTalkTimer = setTimeout(buddyRest, 2600);
  });

  renderBuddy();

  // ---- 真天氣：攞 iPad 定位 + OpenWeatherMap ----
  // 記住去 https://openweathermap.org/api 免費攞一條 API key，填落下面呢行就得
  const OWM_API_KEY = 'f4726836ec886e8f7f41baada37d4314';

  const condMap = {
    Clear: '天晴', Clouds: '多雲', Rain: '有雨', Drizzle: '毛毛雨',
    Thunderstorm: '雷暴', Snow: '落雪', Mist: '薄霧', Fog: '大霧', Haze: '有霾'
  };

  function showWeatherError(msg){
    document.getElementById('temp').textContent = '--°C';
    document.getElementById('cond').textContent = msg;
    buddyRest();
  }

  function fetchWeather(lat, lon){
    if(OWM_API_KEY === 'YOUR_API_KEY_HERE'){
      showWeatherError('未設定API key');
      document.getElementById('loc').textContent = '請填入OWM key';
      return;
    }
    const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${OWM_API_KEY}`;
    fetch(url)
      .then(res => {
        if(!res.ok) throw new Error('天氣服務暫時攞唔到');
        return res.json();
      })
      .then(data => {
        const temp = Math.round(data.main.temp);
        const main = data.weather?.[0]?.main || 'Clear';
        const cond = condMap[main] || main;
        document.getElementById('temp').textContent = `${temp}°C`;
        document.getElementById('cond').textContent = cond;
        document.getElementById('loc').textContent = data.name || '--';
        buddyRest();
      })
      .catch(() => showWeatherError('暫時攞唔到天氣'));
  }

  function getLocationAndWeather(){
    if(!navigator.geolocation){
      showWeatherError('裝置唔支援定位');
      return;
    }
    document.getElementById('cond').textContent = '定位緊…';
    setBuddyState('connect');
    navigator.geolocation.getCurrentPosition(
      pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
      () => showWeatherError('未能取得定位'),
      { timeout: 8000 }
    );
  }

  getLocationAndWeather();
  setInterval(getLocationAndWeather, 1000 * 60 * 60 * 3); // 每3小時更新一次天氣就夠

  // ---- 每日一句（按日期輪換） ----
  const quotes = [
    '你只管努力，剩下的交給時間。',
    '慢慢嚟，比較快。',
    '今日嘅堅持，係聽日嘅底氣。',
    '唔使急，穩穩陣陣行落去就得。',
    '每一步都算數。'
  ];
  const dayIndex = new Date().getDate() % quotes.length;
  document.getElementById('quote').textContent = quotes[dayIndex];

  // ---- 主題切換，並記住揀咗邊個 ----
  const themeDots = document.querySelectorAll('.theme-dot');
  function applyTheme(theme){
    document.body.classList.remove('theme-cat-mode','theme-mint-mode');
    if(theme === 'cat') document.body.classList.add('theme-cat-mode');
    if(theme === 'mint') document.body.classList.add('theme-mint-mode');
    themeDots.forEach(d => d.classList.toggle('active', d.dataset.theme === theme));
    renderBuddy(); // 換主題會換埋小夥伴造型同名
    try{ localStorage.setItem('desk-buddy-theme', theme); }catch(e){}
  }
  themeDots.forEach(dot => {
    dot.addEventListener('click', () => applyTheme(dot.dataset.theme));
  });
  let savedTheme = 'dark';
  try{ savedTheme = localStorage.getItem('desk-buddy-theme') || 'dark'; }catch(e){}
  applyTheme(savedTheme);

  // ---- 可折疊 section，狀態存落 localStorage ----
  document.querySelectorAll('.section').forEach(section => {
    const key = `desk-buddy-collapse-${section.dataset.key}`;
    let collapsed = false;
    try{ collapsed = localStorage.getItem(key) === '1'; }catch(e){}
    if(collapsed) section.classList.add('collapsed');

    const header = section.querySelector('.section-header');
    header.addEventListener('click', () => {
      section.classList.toggle('collapsed');
      try{ localStorage.setItem(key, section.classList.contains('collapsed') ? '1' : '0'); }catch(e){}
    });
  });

  // ---- 電台 ----
  const RADIO_STATIONS = [
    { name: 'Groove Salad', desc: '氛圍 chillout', url: 'https://ice1.somafm.com/groovesalad-128-mp3' },
    { name: 'Drone Zone', desc: '深層氛圍', url: 'https://ice1.somafm.com/dronezone-128-mp3' },
    { name: 'Secret Agent', desc: '間諜爵士 lounge', url: 'https://ice1.somafm.com/secretagent-128-mp3' },
    { name: 'Beat Blender', desc: '深房 house', url: 'https://ice1.somafm.com/beatblender-128-mp3' }
  ];

  const radioPlayer = document.getElementById('radio-player');
  const radioListEl = document.getElementById('radio-list');
  const radioNowText = document.getElementById('radio-now-text');
  const radioDot = document.getElementById('radio-dot');
  const radioToggleBtn = document.getElementById('radio-toggle');
  let currentStationIndex = -1;

  function renderStations(){
    radioListEl.innerHTML = '';
    RADIO_STATIONS.forEach((st, i) => {
      const item = document.createElement('div');
      item.className = 'station-item' + (i === currentStationIndex ? ' active' : '');
      item.innerHTML = `<span class="name">${st.name}</span><span class="badge">${st.desc}</span>`;
      item.addEventListener('click', () => toggleStation(i));
      radioListEl.appendChild(item);
    });
  }

  function updateRadioUI(){
    renderStations();
    if(currentStationIndex === -1){
      radioNowText.textContent = '未播放';
      radioDot.classList.remove('on');
      radioToggleBtn.textContent = '播放';
    } else {
      radioNowText.textContent = RADIO_STATIONS[currentStationIndex].name;
      radioDot.classList.add('on');
      radioToggleBtn.textContent = '停止';
    }
  }

  function stopRadio(){
    radioPlayer.pause();
    radioPlayer.removeAttribute('src');
    radioPlayer.load();
    currentStationIndex = -1;
    updateRadioUI();
    setBuddyState('idle');
  }

  function toggleStation(i){
    if(currentStationIndex === i && !radioPlayer.paused){
      stopRadio();
      return;
    }
    stopPodcast(); // 電台同播客唔會同時響
    currentStationIndex = i;
    radioPlayer.src = RADIO_STATIONS[i].url;
    setBuddyState('connect');
    radioPlayer.play().catch(() => {
      radioNowText.textContent = '播放唔到，check下網絡';
      radioDot.classList.remove('on');
      setBuddyState('idle');
    });
    updateRadioUI();
  }

  radioToggleBtn.addEventListener('click', () => {
    if(currentStationIndex === -1){
      toggleStation(0);
    } else {
      stopRadio();
    }
  });

  radioPlayer.addEventListener('playing', () => setBuddyState('speak'));

  radioPlayer.addEventListener('error', () => {
    radioNowText.textContent = '電台暫時連唔到';
    radioDot.classList.remove('on');
    setBuddyState('idle');
  });

  renderStations();

  // ---- 播客：自訂 RSS feed 或者直接 audio 連結 ----
  const podPlayer = document.getElementById('pod-player');
  const podListEl = document.getElementById('pod-list');
  const podEpisodesEl = document.getElementById('pod-episodes');
  const podSubEl = document.getElementById('pod-sub');
  const podNowText = document.getElementById('pod-now-text');
  const podDot = document.getElementById('pod-dot');
  const podUrlInput = document.getElementById('pod-url');
  const podAddBtn = document.getElementById('pod-add-btn');

  let podcasts = [];
  try{ podcasts = JSON.parse(localStorage.getItem('desk-buddy-podcasts')) || []; }catch(e){}
  let podEpisodes = [];       // 而家打開緊嗰個節目嘅單集
  let openShowUrl = null;
  let currentEpisodeUrl = null;
  let currentEpisodeTitle = '';

  function savePodcasts(){
    try{ localStorage.setItem('desk-buddy-podcasts', JSON.stringify(podcasts)); }catch(e){}
  }

  function isAudioUrl(u){
    return /\.(mp3|m4a|aac|ogg|wav)(\?.*)?$/i.test(u);
  }

  // 直接 fetch 唔到（多數係 CORS）就行公共 proxy 兜一兜
  function fetchFeed(url){
    return fetch(url)
      .then(r => { if(!r.ok) throw new Error('bad'); return r.text(); })
      .catch(() =>
        fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url))
          .then(r => { if(!r.ok) throw new Error('bad'); return r.text(); })
      );
  }

  function parseFeed(xmlText){
    const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
    if(doc.querySelector('parsererror')) throw new Error('parse');
    const chTitle = doc.querySelector('channel > title');
    const items = [];
    const nodes = doc.querySelectorAll('item');
    for(let i = 0; i < nodes.length && items.length < 10; i++){
      const it = nodes[i];
      const enc = it.querySelector('enclosure');
      const audio = enc && enc.getAttribute('url');
      if(!audio) continue;
      const t = it.querySelector('title');
      const d = it.querySelector('pubDate');
      items.push({
        title: (t && t.textContent.trim()) || '（無題）',
        url: audio,
        date: d ? d.textContent : ''
      });
    }
    return { title: (chTitle && chTitle.textContent.trim()) || 'Podcast', items };
  }

  function fmtEpDate(str){
    const d = new Date(str);
    if(isNaN(d)) return '';
    return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  }

  function updatePodNow(){
    if(currentEpisodeUrl && !podPlayer.paused){
      podNowText.textContent = currentEpisodeTitle;
      podDot.classList.add('on');
    } else {
      podNowText.textContent = '未播放';
      podDot.classList.remove('on');
    }
  }

  function stopPodcast(){
    podPlayer.pause();
    podPlayer.removeAttribute('src');
    podPlayer.load();
    currentEpisodeUrl = null;
    currentEpisodeTitle = '';
    updatePodNow();
    renderEpisodes();
    renderPodcasts();
  }

  function playEpisode(title, url){
    if(currentEpisodeUrl === url && !podPlayer.paused){
      stopPodcast();
      setBuddyState('idle');
      return;
    }
    stopRadio(); // 電台同播客唔會同時響
    currentEpisodeUrl = url;
    currentEpisodeTitle = title;
    podPlayer.src = url;
    setBuddyState('connect');
    podNowText.textContent = '載入緊…';
    podPlayer.play().catch(() => {
      podNowText.textContent = '播唔到呢集';
      podDot.classList.remove('on');
      setBuddyState('idle');
    });
    renderEpisodes();
    renderPodcasts();
  }

  function renderPodcasts(){
    podListEl.innerHTML = '';
    if(podcasts.length === 0){
      const hint = document.createElement('div');
      hint.className = 'pod-hint';
      hint.textContent = '仲未有節目：貼低 RSS 連結（會自動攞節目名）或者直接 MP3 連結';
      podListEl.appendChild(hint);
      return;
    }
    podcasts.forEach((p, i) => {
      const item = document.createElement('div');
      const isActive = p.type === 'audio'
        ? (currentEpisodeUrl === p.url && !podPlayer.paused)
        : openShowUrl === p.url;
      item.className = 'station-item' + (isActive ? ' active' : '');

      if(p.art){
        const art = document.createElement('img');
        art.className = 'pod-art';
        art.src = p.art;
        art.alt = '';
        art.addEventListener('error', () => art.remove());
        item.appendChild(art);
      }
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = p.name;
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = p.type === 'rss' ? 'RSS' : '音訊';
      const del = document.createElement('button');
      del.className = 'pod-del';
      del.textContent = '×';
      del.setAttribute('aria-label', '刪除');
      del.addEventListener('click', ev => {
        ev.stopPropagation();
        if(p.type === 'audio' && currentEpisodeUrl === p.url) stopPodcast();
        if(openShowUrl === p.url){ openShowUrl = null; podEpisodes = []; renderEpisodes(); }
        podcasts.splice(i, 1);
        savePodcasts();
        renderPodcasts();
      });

      item.appendChild(name);
      item.appendChild(meta);
      item.appendChild(del);
      item.addEventListener('click', () => {
        if(p.type === 'audio'){
          playEpisode(p.name, p.url);
        } else {
          openShow(p);
        }
      });
      podListEl.appendChild(item);
    });
  }

  function renderEpisodes(){
    podEpisodesEl.innerHTML = '';
    podSubEl.hidden = podEpisodes.length === 0;
    podEpisodes.forEach(ep => {
      const item = document.createElement('div');
      const isActive = currentEpisodeUrl === ep.url && !podPlayer.paused;
      item.className = 'station-item' + (isActive ? ' active' : '');
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = ep.title;
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = fmtEpDate(ep.date);
      item.appendChild(name);
      item.appendChild(meta);
      item.addEventListener('click', () => playEpisode(ep.title, ep.url));
      podEpisodesEl.appendChild(item);
    });
  }

  function openShow(p){
    if(openShowUrl === p.url){ // 再撳一次就收埋
      openShowUrl = null;
      podEpisodes = [];
      renderEpisodes();
      renderPodcasts();
      return;
    }
    podNowText.textContent = '載入緊節目…';
    setBuddyState('connect');
    fetchFeed(p.url)
      .then(parseFeed)
      .then(feed => {
        openShowUrl = p.url;
        podEpisodes = feed.items;
        renderEpisodes();
        renderPodcasts();
        updatePodNow();
        buddyRest();
        if(feed.items.length === 0) podNowText.textContent = '呢個 feed 冇音訊單集';
      })
      .catch(() => {
        podNowText.textContent = '讀唔到呢個 feed';
        buddyRest();
      });
  }

  // ---- Apple Podcasts 目錄搜尋（同 iPad 個 Podcasts app 同一個節目庫） ----
  const podResultsEl = document.getElementById('pod-results');
  const podResultsSubEl = document.getElementById('pod-results-sub');
  const POD_SEARCH_COUNTRY = 'HK'; // 想搜其他地區嘅節目庫可以改呢度

  function clearSearchResults(){
    podResultsEl.innerHTML = '';
    podResultsSubEl.hidden = true;
  }

  function renderSearchResults(results){
    clearSearchResults();
    if(results.length === 0) return;
    podResultsSubEl.hidden = false;
    results.forEach(r => {
      const item = document.createElement('div');
      item.className = 'station-item';
      if(r.artworkUrl100){
        const art = document.createElement('img');
        art.className = 'pod-art';
        art.src = r.artworkUrl100;
        art.alt = '';
        art.addEventListener('error', () => art.remove());
        item.appendChild(art);
      }
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = r.collectionName || 'Podcast';
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = r.artistName || '';
      item.appendChild(name);
      item.appendChild(meta);
      item.addEventListener('click', () => {
        if(podcasts.some(p => p.url === r.feedUrl)){
          podNowText.textContent = '加咗呢個節目喇';
          return;
        }
        const show = { name: r.collectionName || 'Podcast', url: r.feedUrl, type: 'rss', art: r.artworkUrl100 || '' };
        podcasts.push(show);
        savePodcasts();
        renderPodcasts();
        clearSearchResults();
        podUrlInput.value = '';
        podNowText.textContent = '已加入：' + show.name;
        openShow(show); // 加完即刻攞埋最新單集
      });
      podResultsEl.appendChild(item);
    });
  }

  function searchPodcasts(term){
    podNowText.textContent = '搵緊「' + term + '」…';
    setBuddyState('connect');
    const url = 'https://itunes.apple.com/search?media=podcast&limit=8'
      + '&country=' + POD_SEARCH_COUNTRY
      + '&term=' + encodeURIComponent(term);
    fetch(url)
      .then(r => { if(!r.ok) throw new Error('bad'); return r.json(); })
      .then(data => {
        const results = (data.results || []).filter(r => r.feedUrl);
        renderSearchResults(results);
        podNowText.textContent = results.length ? '搵到 ' + results.length + ' 個節目' : '搵唔到，試下第二個關鍵字';
        buddyRest();
      })
      .catch(() => {
        podNowText.textContent = '搜尋唔到，check下網絡';
        buddyRest();
      });
  }

  function addByUrl(url){
    if(podcasts.some(p => p.url === url)){
      podNowText.textContent = '加咗呢個連結喇';
      return;
    }
    if(isAudioUrl(url)){
      let name = '音訊';
      try{ name = decodeURIComponent(url.split('/').pop().split('?')[0]) || '音訊'; }catch(e){}
      podcasts.push({ name, url, type: 'audio' });
      savePodcasts();
      renderPodcasts();
      podUrlInput.value = '';
    } else {
      podNowText.textContent = '載入緊 feed…';
      setBuddyState('connect');
      fetchFeed(url)
        .then(parseFeed)
        .then(feed => {
          podcasts.push({ name: feed.title, url, type: 'rss' });
          savePodcasts();
          renderPodcasts();
          podUrlInput.value = '';
          podNowText.textContent = '已加入：' + feed.title;
          buddyRest();
        })
        .catch(() => {
          podNowText.textContent = '讀唔到呢條 feed，check下條連結';
          buddyRest();
        });
    }
  }

  podAddBtn.addEventListener('click', () => {
    const v = podUrlInput.value.trim();
    if(!v) return;
    if(/^https?:\/\//i.test(v)){
      clearSearchResults();
      addByUrl(v);
    } else {
      searchPodcasts(v);
    }
  });

  // 打字係搜尋、貼連結係加入，個掣自動轉字
  podUrlInput.addEventListener('input', () => {
    podAddBtn.textContent = /^https?:\/\//i.test(podUrlInput.value.trim()) ? '加入' : '搜尋';
  });

  podUrlInput.addEventListener('keydown', ev => {
    if(ev.key === 'Enter') podAddBtn.click();
  });

  podPlayer.addEventListener('playing', () => {
    updatePodNow();
    renderEpisodes();
    renderPodcasts();
    setBuddyState('speak');
  });

  podPlayer.addEventListener('ended', () => {
    stopPodcast();
    setBuddyState('idle');
  });

  podPlayer.addEventListener('error', () => {
    if(!currentEpisodeUrl) return; // stopPodcast 清 src 都會觸發 error，唔使理
    podNowText.textContent = '播唔到呢集';
    podDot.classList.remove('on');
    setBuddyState('idle');
  });

  renderPodcasts();
</script>

</body>
</html>
