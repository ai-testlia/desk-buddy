<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>桌面小夥伴</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+HK:wght@300;400;500;700&display=swap');

  :root{
    --bg: #0F1115;
    --screen: #171B21;
    --screen-edge: #23282F;
    --gold: #E3A94A;
    --gold-dim: #E3A94A66;
    --rose: #E8A2A8;
    --teal: #5FA8A0;
    --ink: #EFEAE0;
    --ink-dim: #9CA3AC;
    --divider: #2A2F37;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% -10%, #23283066 0%, transparent 55%),
      radial-gradient(ellipse at 90% 110%, #E3A94A14 0%, transparent 50%),
      var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 28px 16px;
    font-family:'Noto Sans HK', sans-serif;
    color: var(--ink);
  }

  .device{
    width: 100%;
    max-width: 620px;
    background: linear-gradient(155deg, var(--screen-edge), var(--screen) 12%);
    border-radius: 28px;
    padding: 22px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.04);
    position: relative;
  }

  /* screw dots, echoing the reference mock's hardware bezel */
  .device::before, .device::after{
    content:'';
    position:absolute;
    width:6px; height:6px;
    border-radius:50%;
    background: #3A4048;
    top:14px;
  }
  .device::before{ left:14px; }
  .device::after{ right:14px; }

  .screen{
    background: linear-gradient(160deg, #10131700, #00000022);
    border-radius: 18px;
    padding: 26px 24px 20px;
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 22px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .companion{
    width: 30px; height: 30px;
    border-radius: 9px;
    background: linear-gradient(145deg, var(--teal), #3d7c76);
    position: relative;
    flex-shrink:0;
  }
  .companion .eye{
    position:absolute;
    width:4px; height:4px;
    background: var(--ink);
    border-radius:50%;
    top:12px;
    animation: blink 4.5s infinite;
  }
  .companion .eye.l{ left:8px; }
  .companion .eye.r{ right:8px; }
  @keyframes blink{
    0%,90%,100%{ transform: scaleY(1); }
    93%{ transform: scaleY(0.1); }
  }

  .brand-text{ line-height:1.2; }
  .brand-text .name{ font-size:13px; font-weight:500; color: var(--ink); }
  .brand-text .tag{ font-size:11px; color: var(--ink-dim); letter-spacing:0.5px; }

  .menu-pill{
    font-size:11px;
    color: var(--ink-dim);
    border:1px solid var(--divider);
    padding: 5px 14px;
    border-radius: 999px;
    letter-spacing: 1px;
  }

  .clock-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap: 16px;
    margin-bottom: 20px;
  }

  .clock{
    font-family:'Space Grotesk', sans-serif;
    font-size: 68px;
    font-weight: 600;
    letter-spacing: 1px;
    line-height:1;
    background: linear-gradient(90deg, var(--gold), var(--rose));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .date-line{
    margin-top: 10px;
    font-size: 13px;
    color: var(--ink-dim);
    display:flex;
    gap:8px;
    align-items:center;
  }
  .date-line .dow{
    color: var(--teal);
    font-weight:500;
  }

  .weather{
    text-align:right;
    flex-shrink:0;
  }
  .weather .temp{
    font-family:'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight:600;
  }
  .weather .cond{
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 4px;
  }
  .weather .loc{
    font-size: 11px;
    color: var(--ink-dim);
    opacity:0.7;
    margin-top: 2px;
  }

  .quote-box{
    border-top: 1px solid var(--divider);
    padding-top: 16px;
    display:flex;
    gap: 14px;
    align-items:flex-start;
  }

  .quote-box .qtag{
    font-size: 11px;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    padding: 3px 9px;
    border-radius: 999px;
    flex-shrink:0;
    margin-top: 2px;
    letter-spacing: 1px;
  }

  .quote-box p{
    font-size: 14px;
    line-height:1.6;
    color: var(--ink);
  }

  .theme-row{
    display:flex;
    justify-content:center;
    gap: 10px;
    margin-top: 20px;
  }

  .theme-dot{
    width: 22px; height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }
  .theme-dot:hover{ transform: scale(1.1); }
  .theme-dot.active{ border-color: var(--ink); }

  .theme-dark{ background: linear-gradient(135deg,#171B21,#23282F); }
  .theme-cat{ background: linear-gradient(135deg,#F2D9CE,#E8A2A8); }
  .theme-mint{ background: linear-gradient(135deg,#DCE8E1,#8FBBA8); }

  .hint{
    text-align:center;
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 16px;
    opacity: 0.55;
  }

  /* --- light / cat theme override --- */
  body.theme-cat-mode{
    --bg:#F7ECE4; --screen:#FBEFE7; --screen-edge:#F0DCCF;
    --gold:#D98A5E; --rose:#E38C97; --teal:#C77B7B;
    --ink:#3A241C; --ink-dim:#8A6A5C; --divider:#E6CFC0;
  }
  body.theme-mint-mode{
    --bg:#EEF3EF; --screen:#F5F9F6; --screen-edge:#E2ECE5;
    --gold:#7FA98F; --rose:#9DBFA8; --teal:#5C8E77;
    --ink:#22322A; --ink-dim:#6E8B7B; --divider:#D6E4DB;
  }

  @media (max-width: 480px){
    .clock{ font-size: 52px; }
    .clock-row{ flex-direction: column; }
    .weather{ text-align:left; }
  }

  @media (prefers-reduced-motion: reduce){
    .companion .eye{ animation: none; }
  }
</style>
</head>
<body>

  <div class="device">
    <div class="screen">
      <div class="topbar">
        <div class="brand">
          <div class="companion"><span class="eye l"></span><span class="eye r"></span></div>
          <div class="brand-text">
            <div class="name">桌面小夥伴</div>
            <div class="tag" id="companion-status">陪伴中</div>
          </div>
        </div>
        <div class="menu-pill">MENU</div>
      </div>

      <div class="clock-row">
        <div>
          <div class="clock" id="clock">--:--</div>
          <div class="date-line">
            <span id="date">-- / --</span>
            <span class="dow" id="dow">---</span>
          </div>
        </div>
        <div class="weather">
          <div class="temp" id="temp">--°C</div>
          <div class="cond" id="cond">載入中</div>
          <div class="loc" id="loc">London</div>
        </div>
      </div>

      <div class="quote-box">
        <span class="qtag">今日一句</span>
        <p id="quote">你只管努力，剩下的交給時間。</p>
      </div>
    </div>

    <div class="theme-row">
      <div class="theme-dot theme-dark active" data-theme="dark"></div>
      <div class="theme-dot theme-cat" data-theme="cat"></div>
      <div class="theme-dot theme-mint" data-theme="mint"></div>
    </div>
  </div>

  <div class="hint">呢個係首階段 demo：時鐘、日期、假天氣、每日一句、主題切換</div>

<script>
  // ---- 時鐘 + 日期 ----
  function updateClock(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = `${hh}:${mm}`;

    const mon = String(now.getMonth()+1).padStart(2,'0');
    const day = String(now.getDate()).padStart(2,'0');
    document.getElementById('date').textContent = `${mon}/${day}`;

    const dows = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    document.getElementById('dow').textContent = dows[now.getDay()];
  }
  updateClock();
  setInterval(updateClock, 1000 * 10); // 每十秒夠用，慳返電

  // ---- 真天氣：攞 iPad 定位 + OpenWeatherMap ----
  // 記住去 https://openweathermap.org/api 免費攞一條 API key，填落下面呢行就得
  const OWM_API_KEY = 'f4726836ec886e8f7f41baada37d4314';

  const condMap = {
    Clear: '天晴', Clouds: '多雲', Rain: '有雨', Drizzle: '毛毛雨',
    Thunderstorm: '雷暴', Snow: '落雪', Mist: '薄霧', Fog: '大霧', Haze: '有霾'
  };

  function showWeatherError(msg){
    document.getElementById('temp').textContent = '--°C';
    document.getElementById('cond').textContent = msg;
  }

  function fetchWeather(lat, lon){
    if(OWM_API_KEY === 'YOUR_API_KEY_HERE'){
      showWeatherError('未設定API key');
      document.getElementById('loc').textContent = '請填入OWM key';
      return;
    }
    const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${OWM_API_KEY}`;
    fetch(url)
      .then(res => {
        if(!res.ok) throw new Error('天氣服務暫時攞唔到');
        return res.json();
      })
      .then(data => {
        const temp = Math.round(data.main.temp);
        const main = data.weather?.[0]?.main || 'Clear';
        const cond = condMap[main] || main;
        document.getElementById('temp').textContent = `${temp}°C`;
        document.getElementById('cond').textContent = cond;
        document.getElementById('loc').textContent = data.name || '--';
      })
      .catch(() => showWeatherError('暫時攞唔到天氣'));
  }

  function getLocationAndWeather(){
    if(!navigator.geolocation){
      showWeatherError('裝置唔支援定位');
      return;
    }
    document.getElementById('cond').textContent = '定位緊…';
    navigator.geolocation.getCurrentPosition(
      pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
      () => showWeatherError('未能取得定位'),
      { timeout: 8000 }
    );
  }

  getLocationAndWeather();
  setInterval(getLocationAndWeather, 1000 * 60 * 60 * 3); // 每3小時更新一次天氣就夠

  // ---- 每日一句（按日期輪換） ----
  const quotes = [
    '你只管努力，剩下的交給時間。',
    '慢慢嚟，比較快。',
    '今日嘅堅持，係聽日嘅底氣。',
    '唔使急，穩穩陣陣行落去就得。',
    '每一步都算數。'
  ];
  const dayIndex = new Date().getDate() % quotes.length;
  document.getElementById('quote').textContent = quotes[dayIndex];

  // ---- 主題切換，並記住揀咗邊個 ----
  const themeDots = document.querySelectorAll('.theme-dot');
  function applyTheme(theme){
    document.body.classList.remove('theme-cat-mode','theme-mint-mode');
    if(theme === 'cat') document.body.classList.add('theme-cat-mode');
    if(theme === 'mint') document.body.classList.add('theme-mint-mode');
    themeDots.forEach(d => d.classList.toggle('active', d.dataset.theme === theme));
    try{ localStorage.setItem('desk-buddy-theme', theme); }catch(e){}
  }
  themeDots.forEach(dot => {
    dot.addEventListener('click', () => applyTheme(dot.dataset.theme));
  });
  let savedTheme = 'dark';
  try{ savedTheme = localStorage.getItem('desk-buddy-theme') || 'dark'; }catch(e){}
  applyTheme(savedTheme);
</script>

</body>
</html>
